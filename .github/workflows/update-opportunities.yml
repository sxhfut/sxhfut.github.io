name: Update Academic Opportunities

on:
  schedule:
    # 08:55 Beijing time. GitHub Actions schedules use UTC.
    - cron: "55 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-academic-opportunities
  cancel-in-progress: false

jobs:
  update-opportunities:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch academic opportunities
        env:
          OPPORTUNITY_MAX_ITEMS: "110"
          OPPORTUNITY_FETCH_TIMEOUT: "12"
          OPPORTUNITY_HCI_DEADLINES_MAX: "26"
          OPPORTUNITY_SOCIAL_DEADLINES_MAX: "26"
          SOCIAL_DEADLINES_PER_VENUE: "2"
          WIKICFP_MAX_QUERIES: "28"
          WIKICFP_MAX_PER_QUERY: "2"
          WIKICFP_MAX_ITEMS: "30"
        run: python scripts/update_opportunities.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- _data/opportunities.json; then
            echo "No opportunity updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/opportunities.json
          git commit -m "Update academic opportunities data"
          git push
